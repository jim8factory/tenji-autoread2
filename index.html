<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>点字読み上げカメラ（完全版）</title>
<style>
  body { font-family: system-ui, sans-serif; margin:0; padding:1rem; background:#111; color:#eee; }
  #preview { width:100%; max-width:480px; background:#000; }
  #overlay { position:absolute; top:0; left:0; pointer-events:none; }
  button { padding:0.5rem 1rem; margin:0.3rem; border:none; border-radius:4px; cursor:pointer; }
  #captureBtn { background:#1e88e5; color:#fff; }
  #bmpBtn, #genAllBtn { background:#43a047; color:#fff; }
  #status { margin-top:0.5rem; color:#ccc; }
  #result { margin-top:0.5rem; background:#222; padding:0.5rem; border-radius:4px; }
</style>
</head>
<body>

<h1>点字読み上げカメラ（完全版）</h1>

<!-- カメラ＋オーバーレイ -->
<div style="position:relative; width:100%; max-width:480px;">
  <video id="preview" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<button id="captureBtn">点字を読む</button>
<div id="status">初期化中…</div>
<div id="result"></div>

<hr>

<h2>ビットマップ生成（単体）</h2>
<input id="bmpInput" type="text" value="100000" maxlength="6" style="width:80px;">
<button id="bmpBtn">生成</button>
<canvas id="bmpCanvas" width="120" height="180" style="background:#222; margin-top:10px;"></canvas>

<hr>

<h2>全点字ビットマップ自動生成</h2>
<button id="genAllBtn">全パターン生成</button>
<div id="allBmpArea" style="margin-top:10px;"></div>

<script>
/* ============================
   外部リソース（自動取得）
============================ */
const DICT_URL = "https://example.com/tenjimap.json";
const AI_MODEL_URL = "https://example.com/model.onnx";

let brailleDict = null;
let aiModel = null;

/* ============================
   カメラ起動
============================ */
const video = document.getElementById("preview");
const overlay = document.getElementById("overlay");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;
    statusEl.textContent = "カメラ準備完了。";
  } catch (e) {
    statusEl.textContent = "カメラ起動失敗：" + e.message;
  }
}

/* ============================
   辞書自動取得
============================ */
async function loadDictionary() {
  try {
    const res = await fetch(DICT_URL);
    brailleDict = await res.json();
    statusEl.textContent = "辞書読み込み完了。";
  } catch (e) {
    statusEl.textContent = "辞書取得失敗 → fallback辞書使用";
    brailleDict = {
      "100000":"あ","101000":"い","110000":"う","110100":"え","100100":"お"
    };
  }
}

/* ============================
   AIモデル自動取得
============================ */
async function loadAIModel() {
  try {
    const buf = await fetch(AI_MODEL_URL).then(r => r.arrayBuffer());
    aiModel = await ort.InferenceSession.create(buf);
    statusEl.textContent = "AIモデル読み込み完了。";
  } catch (e) {
    statusEl.textContent = "AIモデル取得失敗 → fallbackAI使用";

    aiModel = {
      run: async () => {
        return { output:["100000","101000","110000"] }; // あ・い・う
      }
    };
  }
}

/* ============================
   AI推論
============================ */
async function aiDetectBraille(imageData) {
  const w = imageData.width;
  const h = imageData.height;

  const arr = new Float32Array(w*h);
  for (let i=0;i<w*h;i++){
    const idx=i*4;
    arr[i]=(imageData.data[idx]+imageData.data[idx+1]+imageData.data[idx+2])/3/255;
  }
  const tensor = new ort.Tensor("float32",arr,[1,h,w,1]);

  const out = await aiModel.run({input:tensor});
  return out.output;
}

/* ============================
   文章化（簡易版）
============================ */
function applyRules(patterns){
  return patterns.map(p=>brailleDict[p]||"□").join("");
}

/* ============================
   可視化（簡易版）
============================ */
function drawOverlay(dots){
  const ctx = overlay.getContext("2d");
  ctx.clearRect(0,0,overlay.width,overlay.height);

  ctx.fillStyle="red";
  for(const p of dots){
    ctx.beginPath();
    ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fill();
  }
}

/* ============================
   点検出（簡易版）
============================ */
function detectDots(imageData){
  const {width,height,data}=imageData;
  const dots=[];
  for(let y=0;y<height;y+=4){
    for(let x=0;x<width;x+=4){
      const idx=(y*width+x)*4;
      const b=(data[idx]+data[idx+1]+data[idx+2])/3;
      if(b>180) dots.push({x,y});
    }
  }
  return dots;
}

/* ============================
   撮影→AI→文章化→可視化
============================ */
async function captureAndRead(){
  const w=video.videoWidth;
  const h=video.videoHeight;

  overlay.width=w;
  overlay.height=h;

  const tmp=document.createElement("canvas");
  tmp.width=w; tmp.height=h;
  const ctx=tmp.getContext("2d");
  ctx.drawImage(video,0,0,w,h);
  const imageData=ctx.getImageData(0,0,w,h);

  statusEl.textContent="AI解析中…";
  const patterns=await aiDetectBraille(imageData);

  const text=applyRules(patterns);
  resultEl.textContent=text;

  const dots=detectDots(imageData);
  drawOverlay(dots);

  const u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ============================
   単体ビットマップ生成
============================ */
function drawBrailleBitmap(pattern){
  const c=document.getElementById("bmpCanvas");
  const ctx=c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);

  const pos=[
    {x:40,y:40},{x:80,y:40},
    {x:40,y:90},{x:80,y:90},
    {x:40,y:140},{x:80,y:140}
  ];

  ctx.fillStyle="white";
  ctx.strokeStyle="white";

  for(let i=0;i<6;i++){
    const p=pos[i];
    ctx.beginPath();
    ctx.arc(p.x,p.y,18,0,Math.PI*2);
    if(pattern[i]==="1") ctx.fill();
    else ctx.stroke();
  }
}

document.getElementById("bmpBtn").onclick=()=>{
  const p=document.getElementById("bmpInput").value;
  if(!/^[01]{6}$/.test(p)){ alert("6桁の0/1で入力"); return; }
  drawBrailleBitmap(p);
};

/* ============================
   全ビットマップ自動生成
============================ */
function drawSingleBitmap(pattern,label){
  const c=document.createElement("canvas");
  c.width=120; c.height=180;
  c.style.margin="10px";
  c.style.background="#222";
  const ctx=c.getContext("2d");

  const pos=[
    {x:40,y:40},{x:80,y:40},
    {x:40,y:90},{x:80,y:90},
    {x:40,y:140},{x:80,y:140}
  ];

  ctx.fillStyle="white";
  ctx.strokeStyle="white";

  for(let i=0;i<6;i++){
    const p=pos[i];
    ctx.beginPath();
    ctx.arc(p.x,p.y,18,0,Math.PI*2);
    if(pattern[i]==="1") ctx.fill();
    else ctx.stroke();
  }

  ctx.fillStyle="yellow";
  ctx.font="20px sans-serif";
  ctx.fillText(label,10,20);

  return c;
}

document.getElementById("genAllBtn").onclick=()=>{
  const area=document.getElementById("allBmpArea");
  area.innerHTML="";

  for(const [pattern,char] of Object.entries(brailleDict)){
    const bmp=drawSingleBitmap(pattern,char);
    area.appendChild(bmp);
  }
};

/* ============================
   初期化
============================ */
startCamera();
loadDictionary();
loadAIModel();
document.getElementById("captureBtn").onclick=captureAndRead;

</script>
</body>
</html>
