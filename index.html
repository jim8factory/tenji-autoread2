<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>点字読み上げカメラ（最終統合版）</title>
<style>
  body { font-family: system-ui, sans-serif; margin:0; padding:1rem; background:#111; color:#eee; }
  #preview { width:100%; max-width:480px; background:#000; }
  #overlay { position:absolute; top:0; left:0; pointer-events:none; }
  #status { margin-top:0.5rem; color:#ccc; }
  #result { margin-top:0.5rem; background:#222; padding:0.5rem; border-radius:4px; }
  canvas { background:#222; margin:10px; }
</style>
</head>
<body>

<h1>点字読み上げカメラ（最終統合版）</h1>

<div style="position:relative; width:100%; max-width:480px;">
  <video id="preview" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<button id="captureBtn">点字を読む</button>
<div id="status">初期化中…</div>
<div id="result"></div>

<hr>

<h2>点字一覧</h2>
<div id="allBmpArea"></div>

<script>
/* ============================================================
   STEP1：辞書（完全版）
============================================================ */
const brailleDict = {
  "100000":"あ","101000":"い","110000":"う","110100":"え","100100":"お",
  "100010":"か","101010":"き","110010":"く","110110":"け","100110":"こ",
  "100001":"さ","101001":"し","110001":"す","110101":"せ","100101":"そ",
  "100011":"た","101011":"ち","110011":"つ","110111":"て","100111":"と",
  "100000":"な","101000":"に","110000":"ぬ","110100":"ね","100100":"の",
  "100010":"は","101010":"ひ","110010":"ふ","110110":"へ","100110":"ほ",
  "100001":"ま","101001":"み","110001":"む","110101":"め","100101":"も",
  "100011":"や","110011":"ゆ","100111":"よ",
  "101000":"ら","111000":"り","111100":"る","101100":"れ","101100":"ろ",
  "010100":"わ","010110":"ゐ","011010":"ゑ","010010":"を",
  "011100":"ん",
  "001011":"゛","001111":"゜",
  "000101":"ゃ","000110":"ゅ","000011":"ょ",
  "000010":"ー",
  "001001":"#",
  "010110":"1","011010":"2","010010":"3","010011":"4","010101":"5",
  "011011":"6","011001":"7","011101":"8","010111":"9","011100":"0",
  "001000":"*",
  "100001":"a","101001":"b","110001":"c","110101":"d","100101":"e",
  "001010":"。","001110":"、","001011":"？","001011":"！"
};

/* ============================================================
   STEP2：補正ロジック（構造誤差のみ）
============================================================ */
function correctPattern(p) {
    if (!/^[01]{6}$/.test(p)) return "000000";
    let bits = p.split("");

    const L = bits.slice(0,3).join("");
    const R = bits.slice(3).join("");
    if (L === "000" && R !== "000") {
        bits = [...bits.slice(3), ...bits.slice(0,3)];
    }

    const top = bits[0] + bits[1];
    const mid = bits[2] + bits[3];
    const bot = bits[4] + bits[5];
    if (top === "00" && (mid !== "00" || bot !== "00")) {
        bits = [
            bits[4], bits[5],
            bits[2], bits[3],
            bits[0], bits[1]
        ];
    }

    const ones = bits.filter(b => b === "1").length;
    if (ones === 1) bits = ["0","0","0","0","0","0"];

    return bits.join("");
}

/* ============================================================
   STEP3：ステートマシン（濁音・拗音・数字・英字）
============================================================ */
function decodeBrailleCells(cells, dict) {
    let result = "";
    let mode = "jp";

    for (let i = 0; i < cells.length; i++) {
        const p = cells[i];
        const ch = dict[p] || "□";

        if (ch === "#") { mode = "num"; continue; }
        if (ch === "*") { mode = "eng"; continue; }

        if (ch === "゛") { result = applyDakuten(result); continue; }
        if (ch === "゜") { result = applyHandakuten(result); continue; }

        if (ch === "ゃ" || ch === "ゅ" || ch === "ょ") {
            result = applyYouon(result, ch);
            continue;
        }

        if (mode === "num") {
            if ("0123456789".includes(ch)) { result += ch; continue; }
            mode = "jp";
        }

        if (mode === "eng") {
            if (/^[a-z]$/.test(ch)) { result += ch; continue; }
            mode = "jp";
        }

        result += ch;
    }

    return result;
}

function applyDakuten(str) {
    if (!str) return str;
    const last = str.slice(-1);
    const base = str.slice(0,-1);
    const map = {
        "か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご",
        "さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ",
        "た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど",
        "は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ"
    };
    return base + (map[last] || last);
}

function applyHandakuten(str) {
    if (!str) return str;
    const last = str.slice(-1);
    const base = str.slice(0,-1);
    const map = {
        "は":"ぱ","ひ":"ぴ","ふ":"ぷ","へ":"ぺ","ほ":"ぽ"
    };
    return base + (map[last] || last);
}

function applyYouon(str, yo) {
    if (!str) return str;
    const last = str.slice(-1);
    const base = str.slice(0,-1);
    const map = {
        "き":"き"+yo,"し":"し"+yo,"ち":"ち"+yo,"に":"に"+yo,
        "ひ":"ひ"+yo,"み":"み"+yo,"り":"り"+yo,
        "ぎ":"ぎ"+yo,"じ":"じ"+yo,"ぢ":"ぢ"+yo,
        "び":"び"+yo,"ぴ":"ぴ"+yo
    };
    return base + (map[last] || (last+yo));
}

/* ============================================================
   STEP4：AI（ダミー）
============================================================ */
async function aiDetectBraille(imageData) {
    return ["100000","001011","101000"]; // あ + ゛ + い → がい
}

/* ============================================================
   STEP5：統合処理
============================================================ */
async function processBraille(imageData) {
    const raw = await aiDetectBraille(imageData);
    const corrected = raw.map(p => correctPattern(p));
    const text = decodeBrailleCells(corrected, brailleDict);

    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);

    return text;
}

/* ============================================================
   STEP6：一覧生成（必ず表示）
============================================================ */
function drawSingleBitmap(pattern,label){
  const c=document.createElement("canvas");
  c.width=120; c.height=180;
  const ctx=c.getContext("2d");

  const pos=[
    {x:40,y:40},{x:80,y:40},
    {x:40,y:90},{x:80,y:90},
    {x:40,y:140},{x:80,y:140}
  ];

  ctx.fillStyle="white";
  ctx.strokeStyle="white";

  for(let i=0;i<6;i++){
    const p=pos[i];
    ctx.beginPath();
    ctx.arc(p.x,p.y,18,0,Math.PI*2);
    if(pattern[i]==="1") ctx.fill();
    else ctx.stroke();
  }

  ctx.fillStyle="yellow";
  ctx.font="20px sans-serif";
  ctx.fillText(label,10,20);

  return c;
}

function generateList() {
  const area=document.getElementById("allBmpArea");
  area.innerHTML="";
  for(const [pattern,char] of Object.entries(brailleDict)){
    area.appendChild(drawSingleBitmap(pattern,char));
  }
}

/* ============================================================
   STEP7：カメラ
============================================================ */
const video=document.getElementById("preview");
const statusEl=document.getElementById("status");
const resultEl=document.getElementById("result");

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;
    statusEl.textContent = "カメラ準備完了。";
  } catch (e) {
    statusEl.textContent = "カメラ起動失敗：" + e.message;
  }
}

/* ============================================================
   STEP8：撮影 → 統合処理
============================================================ */
document.getElementById("captureBtn").onclick = async () => {
    const w = video.videoWidth;
    const h = video.videoHeight;

    const tmp=document.createElement("canvas");
    tmp.width=w; tmp.height=h;
    const ctx=tmp.getContext("2d");
    ctx.drawImage(video,0,0,w,h);
    const imageData=ctx.getImageData(0,0,w,h);

    const text = await processBraille(imageData);
    resultEl.textContent = text;
};

/* ============================================================
   初期化
============================================================ */
startCamera();
generateList(); // 一覧は必ず表示

</script>
</body>
</html>
