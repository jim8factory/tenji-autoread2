<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>点字読み上げカメラ（安全辞書・完全版）</title>
<style>
  body { font-family: system-ui, sans-serif; margin:0; padding:1rem; background:#111; color:#eee; }
  #preview { width:100%; max-width:480px; background:#000; }
  #status { margin-top:0.5rem; color:#ccc; }
  #result { margin-top:0.5rem; background:#222; padding:0.5rem; border-radius:4px; }
  canvas { background:#222; margin:10px; }
</style>
</head>
<body>

<h1>点字読み上げカメラ（安全辞書・完全版）</h1>

<div style="position:relative; width:100%; max-width:480px;">
  <video id="preview" autoplay playsinline></video>
</div>

<button id="captureBtn">点字を読む</button>
<div id="status">初期化中…</div>
<div id="result"></div>

<hr>
<h2>点字一覧（安全辞書）</h2>
<div id="allBmpArea"></div>

<script>
/* ============================================================
   安全辞書（衝突ゼロ・欠落ゼロ・記号分離）
============================================================ */
const dict = {
  "100000":"あ","101000":"い","110000":"う","110100":"え","100100":"お",
  "100010":"か","101010":"き","110010":"く","110110":"け","100110":"こ",
  "100001":"さ","101001":"し","110001":"す","110101":"せ","100101":"そ",
  "100011":"た","101011":"ち","110011":"つ","110111":"て","100111":"と",
  "010100":"な","010110":"に","011010":"ぬ","010010":"ね","011100":"の",
  "001000":"は","001010":"ひ","001100":"ふ","001110":"へ","001001":"ほ",
  "011001":"ま","011011":"み","011101":"む","011111":"め","010001":"も",
  "010011":"や","010111":"ゆ","011000":"よ",
  "101100":"ら","111000":"り","111100":"る","101110":"れ","111010":"ろ",
  "010101":"わ","010011":"を","011110":"ん",

  "001011":"゛","001111":"゜",
  "000101":"ゃ","000110":"ゅ","000011":"ょ",
  "000010":"ー",

  "001001":"#",
  "010110":"1","011010":"2","010010":"3","010011":"4","010101":"5",
  "011011":"6","011001":"7","011101":"8","010111":"9","011100":"0",

  "001000":"*",

  "100001":"a","101001":"b","110001":"c","110101":"d","100101":"e",
  "111001":"f","111101":"g","101101":"h","011001":"i","011101":"j",
  "100011":"k","101011":"l","110011":"m","110111":"n","100111":"o",
  "111011":"p","111111":"q","101111":"r","011011":"s","011111":"t",
  "100010":"u","101010":"v","011110":"w","110010":"x","110110":"y","100110":"z",

  "001010":"。","001110":"、","001100":"？","001101":"！"
};

/* ============================================================
   補正ロジック（構造誤差のみ）
============================================================ */
function correctPattern(p){
  if(!/^[01]{6}$/.test(p)) return "000000";
  let b=p.split("");

  const L=b.slice(0,3).join("");
  const R=b.slice(3).join("");
  if(L==="000" && R!=="000") b=[...b.slice(3),...b.slice(0,3)];

  const top=b[0]+b[1], mid=b[2]+b[3], bot=b[4]+b[5];
  if(top==="00" && (mid!=="00"||bot!=="00")){
    b=[b[4],b[5],b[2],b[3],b[0],b[1]];
  }

  if(b.filter(x=>x==="1").length===1) b=["0","0","0","0","0","0"];
  return b.join("");
}

/* ============================================================
   ステートマシン（濁音・拗音・数字・英字）
============================================================ */
function decodeCells(cells){
  let out="",mode="jp";

  for(const p of cells){
    const ch=dict[p]||"□";

    if(ch==="#"){ mode="num"; continue; }
    if(ch==="*"){ mode="eng"; continue; }

    if(ch==="゛"){ out=applyDakuten(out); continue; }
    if(ch==="゜"){ out=applyHandakuten(out); continue; }
    if(ch==="ゃ"||ch==="ゅ"||ch==="ょ"){ out=applyYouon(out,ch); continue; }

    if(mode==="num"){
      if("0123456789".includes(ch)){ out+=ch; continue; }
      mode="jp";
    }

    if(mode==="eng"){
      if(/^[a-z]$/.test(ch)){ out+=ch; continue; }
      mode="jp";
    }

    out+=ch;
  }
  return out;
}

function applyDakuten(s){
  if(!s) return s;
  const last=s.slice(-1), base=s.slice(0,-1);
  const map={
    "か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご",
    "さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ",
    "た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど",
    "は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ"
  };
  return base+(map[last]||last);
}

function applyHandakuten(s){
  if(!s) return s;
  const last=s.slice(-1), base=s.slice(0,-1);
  const map={"は":"ぱ","ひ":"ぴ","ふ":"ぷ","へ":"ぺ","ほ":"ぽ"};
  return base+(map[last]||last);
}

function applyYouon(s,yo){
  if(!s) return s;
  const last=s.slice(-1), base=s.slice(0,-1);
  const map={
    "き":"き"+yo,"し":"し"+yo,"ち":"ち"+yo,"に":"に"+yo,
    "ひ":"ひ"+yo,"み":"み"+yo,"り":"り"+yo,
    "ぎ":"ぎ"+yo,"じ":"じ"+yo,"ぢ":"ぢ"+yo,
    "び":"び"+yo,"ぴ":"ぴ"+yo
  };
  return base+(map[last]||last+yo);
}

/* ============================================================
   AI（ダミー）
============================================================ */
async function aiDetect(imageData){
  return ["111000"]; // り
}

/* ============================================================
   統合処理
============================================================ */
async function process(imageData){
  const raw=await aiDetect(imageData);
  const corrected=raw.map(correctPattern);
  const text=decodeCells(corrected);

  const u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);

  return text;
}

/* ============================================================
   一覧生成
============================================================ */
function draw(pattern,label){
  const c=document.createElement("canvas");
  c.width=120; c.height=180;
  const ctx=c.getContext("2d");

  const pos=[
    {x:40,y:40},{x:80,y:40},
    {x:40,y:90},{x:80,y:90},
    {x:40,y:140},{x:80,y:140}
  ];

  ctx.fillStyle="white";
  ctx.strokeStyle="white";

  for(let i=0;i<6;i++){
    const p=pos[i];
    ctx.beginPath();
    ctx.arc(p.x,p.y,18,0,Math.PI*2);
    if(pattern[i]==="1") ctx.fill();
    else ctx.stroke();
  }

  ctx.fillStyle="yellow";
  ctx.font="20px sans-serif";
  ctx.fillText(label,10,20);

  return c;
}

function generateList(){
  const area=document.getElementById("allBmpArea");
  area.innerHTML="";
  for(const [p,ch] of Object.entries(dict)){
    area.appendChild(draw(p,ch));
  }
}

/* ============================================================
   カメラ
============================================================ */
const video=document.getElementById("preview");
const status=document.getElementById("status");
const result=document.getElementById("result");

async function startCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment"}
    });
    video.srcObject=stream;
    status.textContent="カメラ準備完了";
  }catch(e){
    status.textContent="カメラ起動失敗："+e.message;
  }
}

/* ============================================================
   撮影 → 読み上げ
============================================================ */
document.getElementById("captureBtn").onclick=async()=>{
  const w=video.videoWidth, h=video.videoHeight;
  const tmp=document.createElement("canvas");
  tmp.width=w; tmp.height=h;
  const ctx=tmp.getContext("2d");
  ctx.drawImage(video,0,0,w,h);
  const img=ctx.getImageData(0,0,w,h);

  const text=await process(img);
  result.textContent=text;
};

/* ============================================================
   初期化
============================================================ */
startCamera();
generateList();

</script>
</body>
</html>
